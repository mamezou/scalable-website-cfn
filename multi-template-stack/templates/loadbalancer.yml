AWSTemplateFormatVersion: 2010-09-09
Description: Create Application LoadBalancer

Parameters:
  PublicSubnet1:
    Type: String
  PublicSubnet2:
    Type: String
  VPCID:
    Type: String
  SecurityGroupLB:
    Type: String

Resources:
  FrontLB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Ref AWS::StackName
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref SecurityGroupLB

  FrontLBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref FrontLB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref FrontLBTargetGroup

  FrontLBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${AWS::StackName}-tg
      VpcId: !Ref VPCID
      Port: 80
      Protocol: HTTP
      HealthCheckPath: /health-check.html

Outputs:
  FrontLBTargetGroup:
    Value: !Ref FrontLBTargetGroup
  FrontLBEndpoint:
    Value: !GetAtt FrontLB.DNSName
