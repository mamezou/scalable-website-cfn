AWSTemplateFormatVersion: 2010-09-09
Description: Create SecurityGroup

Parameters:
  VPCID:
    Type: String

Resources:
  SecurityGroupLB:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: "SG-LB"
      GroupDescription: !Ref AWS::StackName
      VpcId: !Ref VPCID
      SecurityGroupIngress:
        - IpProtocol: tcp
          ToPort: 80
          FromPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          ToPort: 443
          FromPort: 443
          CidrIp: 0.0.0.0/0

  SecurityGroupASG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: "SG-ASG"
      GroupDescription: !Ref AWS::StackName
      VpcId: !Ref VPCID
      SecurityGroupIngress:
        - IpProtocol: tcp
          ToPort: 80
          FromPort: 80
          SourceSecurityGroupId: !Ref SecurityGroupLB

  SecurityGroupEFS:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref VPCID
      GroupName: "SG-FS"
      GroupDescription: Security group for mount target
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: '2049'
        ToPort: '2049'
        SourceSecurityGroupId: !Ref SecurityGroupASG

  SecurityGroupDB:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: "SG-DB"
      GroupDescription: !Ref AWS::StackName
      VpcId: !Ref VPCID
      SecurityGroupIngress:
        - IpProtocol: tcp
          ToPort: 3306
          FromPort: 3306
          SourceSecurityGroupId: !Ref SecurityGroupASG

Outputs:
  SecurityGroupLB:
    Value: !Ref SecurityGroupLB
  SecurityGroupASG:
    Value: !Ref SecurityGroupASG
  SecurityGroupDB:
    Value: !Ref SecurityGroupDB
  SecurityGroupEFS:
    Value: !Ref SecurityGroupEFS